<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eta banner</title>
    <style>
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        background: #000;
        overflow: hidden;
      }
      .frame {
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      .copy {
        text-align: left;
        font-family: Arial Black, Arial, Helvetica, sans-serif;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 0.92;
        color: #fff;
      }
      .line {
        font-size: 92px;
        white-space: nowrap;
        text-transform: none;
      }
      .skins {
        color: #ff2a2a;
      }
      .url {
        margin-top: 28px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0;
        text-transform: none;
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="copy">
        <div class="line">TRADE NFTs LIKE</div>
        <div class="line">YOU TRADE <span class="skins">SKINS.</span></div>
        <div class="url">etalabs.xyz</div>
      </div>
    </div>
  </body>
</html>
